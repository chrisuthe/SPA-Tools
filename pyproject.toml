[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spatools"
version = "0.1.0"
description = "Open-source Volvo SPA platform diagnostic and tuning toolkit"
requires-python = ">=3.10"
dependencies = [
    "python-doipclient>=1.1.0",
    "udsoncan>=1.25.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
spatools = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
