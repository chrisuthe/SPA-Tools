[package]
name = "spatools-ui"
version = "0.1.0"
description = "SPATools Desktop UI"
authors = ["SPATools"]
edition = "2021"

[lib]
name = "spatools_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
